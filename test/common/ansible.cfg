[defaults]
inventory = /workspace/test/common/inventory.yaml
interpreter_python = /usr/local/bin/python3
retry_files_enabled = False
host_key_checking = True
display_args_to_stdout = False
callbacks_enabled = timings
callback_plugins = /workspace/test/common/callback_plugins
collections_path = /root/.ansible/collections:/usr/share/ansible/collections
local_tmp = /tmp/ansible-local

[connection]
pipelining = True
