# The catalogue of the addons. It holds, in data, what every engine used to
# repeat in Go: the image, the port, the plans of the resources and the
# contract of the environment. A type of addon is a file, not a hundred
# lines of code.
type: postgres
engine: cnpg
kind: postgres
port: 5432
# The operator this type needs in the cluster. A project that declares a
# PostgreSQL database is refused when the platform does not have the
# operator: the whole project would fail to apply, not only the database.
operator: cnpg
# The image of the server. It is pinned: a tag can be moved, and the addon
# would then run something else than what was reviewed.
image: ghcr.io/cloudnative-pg/postgresql:16.10-minimal-trixie@sha256:294fd7631f8d66fa54bf6ffa2948af685a20fb695fe748a6bafa71c42f1233b7
# Les versions que le manifeste peut demander. La cle est la version
# majeure de la base, la valeur est l'image, epinglee par digest : une
# version que le catalogue ne connait pas est refusee a la compilation.
defaultVersion: "16"
versions:
  "16": ghcr.io/cloudnative-pg/postgresql:16.10-minimal-trixie@sha256:294fd7631f8d66fa54bf6ffa2948af685a20fb695fe748a6bafa71c42f1233b7
plans:
  tiny:
    instances: 1
    storage: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  small:
    instances: 1
    storage: 1Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
  medium:
    instances: 2
    storage: 10Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
# The contract: the variables the applications receive, and the key of the
# secret that holds them. The values never pass through Kuberpack.
env:
  DATABASE_URL: uri
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: dbname
  POSTGRES_HOST: host
  POSTGRES_PORT: port
