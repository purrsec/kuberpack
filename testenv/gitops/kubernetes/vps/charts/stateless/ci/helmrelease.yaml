# Example HelmRelease (contract). Live GitOps is in pepe/infra-homelab.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web
  namespace: apps
spec:
  interval: 10m
  chart:
    spec:
      chart: stateless
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: kuberpack
  values:
    image: git.host.bzh/pepe/web:sha-0123456789abcdef0123456789abcdef01234567@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    port: 8080
    healthcheck: /healthz
    hostname: web.example.org
    ingressClassName: traefik
  test:
    enable: true
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
      remediateLastFailure: true
