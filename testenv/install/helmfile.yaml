# Independent releases: Kuberpack must reuse the operator and preserve the app.
repositories:
  - name: jetstack
    url: https://charts.jetstack.io
helmDefaults:
  wait: true
  timeout: 300
releases:
  - name: custom-web
    namespace: helmfile-apps
    createNamespace: true
    chart: ./charts/custom
  - name: external-cert-manager
    namespace: external-cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.18.2
    values:
      - crds:
          enabled: true
