apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-settings
data:
  message: owned-by-helmfile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: custom-web}
  template:
    metadata:
      labels: {app: custom-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.1-alpine
          ports: [{containerPort: 80}]
