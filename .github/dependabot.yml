version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /test/common
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /test/examples
    schedule:
      interval: weekly
      day: monday
