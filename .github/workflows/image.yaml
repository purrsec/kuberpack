name: CI

on:
  push:
    branches: ['**']
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.builder"
      - ".dockerignore"
      - "provisioning/**"
      - "test/**"
      - "Makefile"
      - ".github/workflows/**"
    tags: ['v*']
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.builder"
      - ".dockerignore"
      - "provisioning/**"
      - "test/**"
      - "Makefile"
      - ".github/workflows/**"
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  static:
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: static

  light:
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: unit-light

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install latest golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Lint with default preset
        run: golangci-lint run ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install latest govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan reachable vulnerabilities
        run: govulncheck ./...

  heavy:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [static, light]
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: unit-heavy

  superheavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [static, light, heavy]
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: unit-superheavy

  image:
    # Main pushes skip the expensive suites: explicitly accept those skips.
    # A manual run executes both suites and may publish only after they pass.
    if: >-
      ${{ !cancelled() &&
          needs.static.result == 'success' && needs.light.result == 'success' &&
          needs.lint.result == 'success' && needs.vuln.result == 'success' &&
          (needs.heavy.result == 'success' || needs.heavy.result == 'skipped') &&
          (needs.superheavy.result == 'success' || needs.superheavy.result == 'skipped') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [static, light, lint, vuln, heavy, superheavy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kuberpack
            file: Dockerfile
            image: ghcr.io/${{ github.repository }}
          - name: builder
            file: Dockerfile.builder
            image: ghcr.io/${{ github.repository }}-builder
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
