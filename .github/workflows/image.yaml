name: CI

on:
  push:
    branches: ['**']
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.builder"
      - ".dockerignore"
      - "provisioning/**"
      - "test/**"
      - "Makefile"
      - ".github/workflows/**"
    tags: ['v*']
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "Dockerfile.builder"
      - ".dockerignore"
      - "provisioning/**"
      - "test/**"
      - "Makefile"
      - ".github/workflows/**"
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  static:
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: static

  light:
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: unit-light

  heavy:
    needs: [static, light]
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: unit-heavy

  superheavy:
    if: github.event_name != 'pull_request'
    needs: [static, light, heavy]
    uses: ./.github/workflows/test-suite.yaml
    with:
      suite: unit-superheavy

  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [static, light, heavy, superheavy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kuberpack
            file: Dockerfile
            image: ghcr.io/${{ github.repository }}
          - name: builder
            file: Dockerfile.builder
            image: ghcr.io/${{ github.repository }}-builder
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
