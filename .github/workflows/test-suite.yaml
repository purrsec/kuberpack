name: Docker test suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'unit-superheavy' && 45 || 20 }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Restore verified Go build and module caches
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kuberpack-test-cache
          key: ${{ runner.os }}-${{ runner.arch }}-test-go1269-${{ inputs.suite }}-${{ hashFiles('go.sum', 'test/common/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-test-go1269-${{ inputs.suite }}-
            ${{ runner.os }}-${{ runner.arch }}-test-go1269-
      - name: Build the same pinned toolbox used locally
        timeout-minutes: 10
        uses: docker/build-push-action@v7
        with:
          context: test/common
          load: true
          tags: kuberpack-test-tools:ci
          cache-from: type=gha,scope=kuberpack-test-tools
          cache-to: type=gha,mode=max,scope=kuberpack-test-tools
      - name: Run the shared Docker entry point
        run: >-
          python3 test/run.py ${{ inputs.suite }}
          --image kuberpack-test-tools:ci
          --cache-dir '${{ runner.temp }}/kuberpack-test-cache'
          --artifacts '.test-results/${{ inputs.suite }}'
      - name: Ensure infrastructure failures also have JSON and JUnit reports
        if: always()
        run: python3 test/common/finalize_report.py '.test-results/${{ inputs.suite }}'
      - name: Preserve assertions, timings and redacted failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ inputs.suite }}
          path: .test-results/${{ inputs.suite }}
          if-no-files-found: error
          retention-days: 14
