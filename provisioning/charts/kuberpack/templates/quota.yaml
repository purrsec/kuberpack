apiVersion: v1
kind: ResourceQuota
metadata:
  name: kuberpack-build
  namespace: {{ .Values.buildNamespace }}
spec:
  hard:
    pods: {{ .Values.buildQuota.pods | quote }}
    requests.cpu: {{ .Values.buildQuota.requestsCPU | quote }}
    requests.memory: {{ .Values.buildQuota.requestsMemory | quote }}
    limits.cpu: {{ .Values.buildQuota.limitsCPU | quote }}
    limits.memory: {{ .Values.buildQuota.limitsMemory | quote }}
