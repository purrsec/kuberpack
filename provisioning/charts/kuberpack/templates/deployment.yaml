apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberpack
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberpack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberpack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberpack
    spec:
      serviceAccountName: kuberpack
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kuberpack
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/kuberpack-control-plane"]
          args:
            - --addr
            - ":8080"
            - --data
            - /var/lib/kuberpack
            {{- if .Values.wait }}
            - --wait
            - {{ .Values.wait | quote }}
            {{- end }}
          env:
            {{- with .Values.nodeMetrics.caBundle }}
            - name: KUBERPACK_KUBELET_CA_PEM
              value: {{ . | quote }}
            {{- end }}
            - name: KUBERPACK_GIT_PROVIDER
              value: {{ .Values.gitProvider | default "forgejo" | quote }}
            - name: KUBERPACK_GIT_URL
              value: {{ required "gitURL is required" (.Values.gitURL | default .Values.forgejoURL) | quote }}
            {{- with .Values.registryURL }}
            - name: KUBERPACK_REGISTRY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.registryUser }}
            - name: KUBERPACK_REGISTRY_USER
              value: {{ . | quote }}
            {{- end }}
            - name: KUBERPACK_GITOPS_URL
              value: {{ required "gitopsURL is required" .Values.gitopsURL | quote }}
            - name: KUBERPACK_GITOPS_BRANCH
              value: {{ .Values.gitopsBranch | quote }}
            - name: KUBERPACK_GITOPS_APPS
              value: {{ .Values.gitopsApps | quote }}
            - name: KUBERPACK_PROJECTS_DIR
              value: {{ .Values.gitopsProjects | quote }}
            - name: KUBERPACK_GITOPS_CHART
              value: {{ .Values.gitopsChart | quote }}
            - name: KUBERPACK_GITOPS_SOURCE
              value: {{ .Values.gitopsSource | quote }}
            - name: KUBERPACK_GITOPS_SOURCE_NAMESPACE
              value: {{ .Values.gitopsSourceNamespace | quote }}
            - name: KUBERPACK_PREVIEW_DOMAIN
              value: {{ .Values.previewDomain | quote }}
            - name: KUBERPACK_WEBHOOK_URL
              {{- if .Values.webhookURL }}
              value: {{ .Values.webhookURL | quote }}
              {{- else }}
              value: {{ printf "https://%s/hooks/forgejo" (required "host is required" .Values.host) | quote }}
              {{- end }}
            - name: KUBERPACK_BUILDER_IMAGE
              value: {{ required "builderImage is required" .Values.builderImage | quote }}
            - name: KUBERPACK_BUILDER_NAMESPACE
              value: {{ .Values.buildNamespace }}
            {{- with .Values.builderPlacement.runtimeClass }}
            # Sandbox du Pod du build : gVisor ou Kata. Vide conserve le
            # runtime par défaut et le noyau partagé du cluster.
            - name: KUBERPACK_BUILDER_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.builderPlacement.nodeSelector }}
            # Pool de nœuds dédié aux builds. Le control plane ajoute
            # toujours l'architecture par défaut du builder.
            - name: KUBERPACK_BUILDER_NODE_SELECTOR
              value: {{ . | toJson | quote }}
            {{- end }}
            {{- with .Values.builderPlacement.tolerations }}
            # Tolérances du pool tainté qui accueille les builds.
            - name: KUBERPACK_BUILDER_TOLERATIONS
              value: {{ . | toJson | quote }}
            {{- end }}
            {{- with .Values.builderResources }}
            - name: KUBERPACK_BUILDER_CPU
              value: {{ .cpu | quote }}
            - name: KUBERPACK_BUILDER_MEMORY
              value: {{ .memory | quote }}
            {{- end }}
            {{- with .Values.buildkitResources }}
            - name: KUBERPACK_BUILDKIT_CPU
              value: {{ .cpu | quote }}
            - name: KUBERPACK_BUILDKIT_MEMORY
              value: {{ .memory | quote }}
            {{- end }}
            {{- with .Values.buildkitCache }}
            # The room of the cache of BuildKit, in megabytes:
            # "Reserved,Free,Maximum". BuildKit deletes the oldest entries
            # of the cache when it grows past the maximum.
            - name: KUBERPACK_BUILDKIT_CACHE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.minFreeDisk }}
            # The space a build needs on the node. A build that does not
            # fit is refused before it starts, with the space that is
            # missing.
            - name: KUBERPACK_MIN_FREE_DISK
              value: {{ . | quote }}
            {{- end }}
            - name: KUBERPACK_EGRESS_ALLOW
              value: {{ .Values.egressAllow | default "" | quote }}
            - name: KUBERPACK_API_RATE_LIMIT
              value: {{ .Values.apiLimits.ratePerMinute | default 1200 | quote }}
            - name: KUBERPACK_API_RATE_BURST
              value: {{ .Values.apiLimits.burst | default 0 | quote }}
            - name: KUBERPACK_API_MAX_CONCURRENCY
              value: {{ .Values.apiLimits.maxConcurrency | default 128 | quote }}
            - name: KUBERPACK_TRUSTED_PROXIES
              value: {{ .Values.apiLimits.trustedProxies | default "" | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: HOME
              value: /home/kuberpack
            - name: KUBERPACK_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberpack
                  key: KUBERPACK_GIT_TOKEN
            - name: KUBERPACK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberpack
                  key: KUBERPACK_API_TOKEN
            - name: KUBERPACK_REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberpack
                  key: KUBERPACK_REGISTRY_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: /var/lib/kuberpack }
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/kuberpack }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kuberpack-data
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
