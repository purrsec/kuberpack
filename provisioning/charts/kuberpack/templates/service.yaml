{{- if .Values.nodePort.enabled }}
{{- fail "NodePort exposure has been removed; publish the API through the HTTPS ingress" }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.ingress.tls) }}
{{- fail "The public control plane ingress requires TLS" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: kuberpack
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: kuberpack
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuberpack
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- with .Values.ingress.issuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kuberpack
                port:
                  name: http
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      {{- if .Values.tlsSecret }}
      secretName: {{ .Values.tlsSecret | quote }}
      {{- end }}
  {{- end }}
{{- end }}
