apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stateless.fullname" . }}-test
  labels:
    app.kubernetes.io/name: {{ include "stateless.fullname" . }}-test
    app.kubernetes.io/component: helm-test
    app.kubernetes.io/part-of: kuberpack
    {{- with .Values.networkPolicy.project }}
    kuberpack.io/project: {{ . | quote }}
    {{- end }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  activeDeadlineSeconds: {{ add (mul .Values.startupProbe.periodSeconds .Values.startupProbe.failureThreshold) 10 }}
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          url={{ printf "http://%s:%v%s" (include "stateless.fullname" .) .Values.port .Values.healthcheck | quote }}
          # Match the application's startup budget, including slow JVMs.
          # Bound each request so a dropped SYN cannot consume the budget.
          deadline=$(( $(date +%s) + {{ mul .Values.startupProbe.periodSeconds .Values.startupProbe.failureThreshold }} ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            wget -q -T 2 -O /dev/null "$url" && echo "ok $url" && exit 0
            i=$((i + 1))
            sleep 1
          done
          echo "timed out after $i attempts: $url never returned 2xx" >&2
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL
