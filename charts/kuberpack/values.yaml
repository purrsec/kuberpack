image: ghcr.io/purrsec/kuberpack:latest
buildNamespace: kuberpack-build
storageClass: ""
gitopsBranch: main
builderImage: ghcr.io/purrsec/kuberpack-builder:latest
# Admission is enforced by the API server, outside the dispatcher's RBAC.
# Rootless BuildKit needs exceptions to restricted Pod Security; arbitrary
# privileged Jobs and host mounts must still be refused.
buildAdmission:
  enabled: true
  buildkitImage: docker.io/moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
# The git forge: forgejo, github or gitlab.
gitProvider: forgejo
gitURL: https://git.example.com
# The OCI registry the images are pushed to. Empty means the URL of the
# forge. registryUser is the namespace of the images.
registryURL: ""
registryUser: ""
# Kept for the installations that still name the forge.
forgejoURL: ""
gitopsURL: https://git.example.com/you/gitops.git
gitopsApps: kubernetes/apps
# The directory of the projects: their manifests and what is
# compiled from them. It is not the directory of the standalone apps.
gitopsProjects: kubernetes/vps/projects
gitopsChart: ./charts/stateless
gitopsSource: gitops
# The namespace of the source: the applications reference it to find
# the GitOps repository they are applied from.
gitopsSourceNamespace: flux-system
previewDomain: preview.example.com
host: kuberpack.example.com

# Public URL of the Forgejo webhook endpoint. Empty means "derive it from
# `host`" (https://<host>/hooks/forgejo). Set it when the control plane is
# reachable on another address or scheme (test environments, internal DNS).
webhookURL: ""

# Extra environment entries for the control plane. Each item accepts the
# `name`/`value` pair or a `valueFrom` block.
extraEnv: []

# Direct, verified HTTPS reads of kubelet CPU quota counters. These reads
# require nodes/metrics, never nodes/proxy. CPU/RAM use metrics.k8s.io.
nodeMetrics:
  enabled: true
  # Optional PEM serving CA when kubelets use a different CA from the API.
  caBundle: ""

# The secrets that pull the images. A private registry needs one.
imagePullSecrets: []

# Public ingress of the control plane.
ingress:
  enabled: true
  className: traefik
  tls: true
  issuer: ""
  annotations: {}
# Secret that holds the certificate of the host. Empty means the default of
# the ingress controller.
tlsSecret: kuberpack-tls

# NodePort service of the control plane. Useful when no public ingress or
# TLS termination is available (test environments).
nodePort:
  enabled: false
  port: 30080

# Egress policy of the build namespace. Disable it when the builder must
# reach hosts on a private range that the default policy excludes.
buildNetworkPolicy:
  enabled: true

# Accès sortants du control plane. L'allowlist réintroduit une forge, un
# registre ou un dépôt GitOps hébergé sur une adresse privée (hôtes, IP ou
# CIDR séparés par des virgules). Vide : seules les adresses publiques sont
# autorisées. Les adresses configurées par l'opérateur (gitURL, registryURL,
# gitopsURL) sont ajoutées automatiquement.
egressAllow: ""

# Limites de la surface API du control plane.
apiLimits:
  # Requêtes par minute et par client. Une valeur négative désactive la
  # limite ; zéro prend la valeur par défaut (1200).
  ratePerMinute: 1200
  # Rafale autorisée. Zéro prend un quart de ratePerMinute.
  burst: 0
  # Requêtes simultanées. Une valeur négative désactive la borne.
  maxConcurrency: 128
  # CIDR des proxys dont X-Forwarded-For est lu, par exemple le réseau des
  # pods de l'ingress. Vide : l'en-tête est ignoré.
  trustedProxies: ""

# Egress du control plane. Désactivé par défaut : le control plane doit
# joindre l'API Kubernetes, les kubelets, Infisical, la forge, le registre et
# le DNS, dont les adresses dépendent de l'installation. Activez-le avec des
# listes complètes, sinon la réconciliation s'arrête.
controlPlaneNetworkPolicy:
  enabled: false
  # CIDR privés que le control plane doit joindre (API server, nœuds,
  # Infisical, forge/registre internes).
  allowedCIDRs: []
  allowedPorts: [443, 6443, 8080, 10250]
  # Règles egress supplémentaires, ajoutées telles quelles.
  extraEgress: []

# The resources of the builder and of its BuildKit sidecar. They are the size
# of the machine that builds: a small server builds small applications.
builderResources:
  cpu: "2"
  memory: 2Gi
buildkitResources:
  cpu: "3"
  memory: 4Gi

# The room of the cache of BuildKit, in megabytes: "Reserved,Free,Maximum".
# BuildKit deletes the oldest entries of the cache when it grows past the
# maximum. Empty means the default of the platform.
buildkitCache: ""

# The space a build needs on the node. A build that does not fit is refused
# before it starts: it says the space that is missing. Empty means the
# default of the platform.
minFreeDisk: ""

# Resource quota of the build namespace. It must leave room for one build Job
# (builder + rootless BuildKit sidecar).
buildQuota:
  pods: "4"
  requestsCPU: "2"
  requestsMemory: 2Gi
  limitsCPU: "16"
  limitsMemory: 24Gi

# Maximum duration of a build: how long the control plane waits for the image
# digest, and the deadline of the build Job. Raise it for slow toolchains
# (a first Python build downloads a large base image).
wait: 15m
