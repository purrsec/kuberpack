apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kuberpack-builder-cache
  namespace: kuberpack-build
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # The cache holds the database of the vulnerabilities of Trivy: it is
      # downloaded once and kept. The database is a few hundred megabytes,
      # and the archive it is unpacked from is written next to it.
      storage: 2Gi
