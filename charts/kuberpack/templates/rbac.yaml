apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberpack
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberpack-build
  namespace: {{ .Values.buildNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberpack-build-dispatch
  namespace: {{ .Values.buildNamespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # The platform reads the output of a build, so that a failure says
  # why. It reads the logs of the pods it dispatches, in the namespace
  # where it dispatches them, and nothing else.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The platform creates the volume that holds the cache of the builder:
  # the database of the vulnerabilities of Trivy. It is a cache: the
  # platform never deletes it, and it never changes its size.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create]
---
# The platform writes the secret that pulls the images of its registry, in
# the namespace of every application. That right is granted by the
# deployment itself, in the GitOps repository: the platform has no right
# over the secrets of the cluster, and it never reads one.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberpack-build-dispatch
  namespace: {{ .Values.buildNamespace }}
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberpack-build-dispatch
{{- if .Values.nodeMetrics.enabled }}
---
# Kubelet metrics have a dedicated read permission. The proxy subresource
# also permits command execution and must not be granted for diagnostics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-kuberpack-node-metrics
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-kuberpack-node-metrics
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-kuberpack-node-metrics
{{- end }}
{{- if .Values.tenantIsolation }}
---
# The tenant identity is bound in a project namespace. A RoleBinding to a
# ClusterRole only grants the namespaced resources of that namespace: the
# tenant cannot reach another namespace or a cluster-scoped resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberpack-tenant
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
# The control plane provisions namespaces, tenant identities, their bindings
# and one Flux Kustomization per project. A ValidatingAdmissionPolicy bounds
# what it may create: it cannot name another identity or another role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-kuberpack-provisioner
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, create, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, update, delete]
  # A RoleBinding may only reference a role the binder can grant. The
  # control plane may bind the tenant role, and nothing else.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [kuberpack-tenant]
    verbs: [bind]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-kuberpack-provisioner
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-kuberpack-provisioner
---
# The Infisical operator scope is a ConfigMap in the control namespace. The
# control plane updates it directly: no global projects Kustomization keeps
# cluster-wide rights just to carry one ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberpack-infisical-scope
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberpack-infisical-scope
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberpack-infisical-scope
{{- end }}
