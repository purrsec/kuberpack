apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberpack
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberpack-build
  namespace: {{ .Values.buildNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberpack-build-dispatch
  namespace: {{ .Values.buildNamespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # The platform reads the output of a build, so that a failure says
  # why. It reads the logs of the pods it dispatches, in the namespace
  # where it dispatches them, and nothing else.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The platform creates the volume that holds the cache of the builder:
  # the database of the vulnerabilities of Trivy. It is a cache: the
  # platform never deletes it, and it never changes its size.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create]
---
# The platform writes the secret that pulls the images of its registry, in
# the namespace of every application. That right is granted by the
# deployment itself, in the GitOps repository: the platform has no right
# over the secrets of the cluster, and it never reads one.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberpack-build-dispatch
  namespace: {{ .Values.buildNamespace }}
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberpack-build-dispatch
{{- if .Values.nodeMetrics.enabled }}
---
# Kubelet metrics have a dedicated read permission. The proxy subresource
# also permits command execution and must not be granted for diagnostics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-kuberpack-node-metrics
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-kuberpack-node-metrics
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-kuberpack-node-metrics
{{- end }}
