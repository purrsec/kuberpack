apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberpack
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberpack-build
  namespace: kuberpack-build
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberpack-build-dispatch
  namespace: kuberpack-build
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # The platform reads the output of a build, so that a failure says
  # why. It reads the logs of the pods it dispatches, in the namespace
  # where it dispatches them, and nothing else.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
# The platform writes the secret that pulls the images of its registry, in
# the namespace of every application. That right is granted by the
# deployment itself, in the GitOps repository: the platform has no right
# over the secrets of the cluster, and it never reads one.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberpack-build-dispatch
  namespace: kuberpack-build
subjects:
  - kind: ServiceAccount
    name: kuberpack
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberpack-build-dispatch
