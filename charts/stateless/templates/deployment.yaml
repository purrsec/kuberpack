apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stateless.fullname" . }}
  labels:
    {{- include "stateless.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "stateless.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        # The pods of the application carry the labels of the platform:
        # the NetworkPolicy of an addon selects the applications that may
        # reach it. Without them, the application is refused by the addon.
        # The labels of the platform hold the labels of the selector.
        {{- include "stateless.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ not .Values.runAsRoot }}
        runAsUser: {{ if .Values.runAsRoot }}0{{ else }}{{ .Values.podSecurityContext.runAsUser }}{{ end }}
        runAsGroup: {{ if .Values.runAsRoot }}0{{ else }}{{ .Values.podSecurityContext.runAsGroup }}{{ end }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ required "image must be a digest-pinned reference" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ required "healthcheck is required" .Values.healthcheck | quote }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck | quote }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck | quote }}
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ not .Values.writableRoot }}
            runAsNonRoot: {{ not .Values.runAsRoot }}
            runAsUser: {{ if .Values.runAsRoot }}0{{ else }}{{ .Values.podSecurityContext.runAsUser }}{{ end }}
            runAsGroup: {{ if .Values.runAsRoot }}0{{ else }}{{ .Values.podSecurityContext.runAsGroup }}{{ end }}
            capabilities:
              drop:
                - ALL
              {{- with .Values.capabilities }}
              add:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range .Values.volumes }}
            - name: {{ .name }}
              mountPath: {{ .path }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range .Values.volumes }}
        - name: {{ .name }}
          {{- if .size }}
          persistentVolumeClaim:
            claimName: {{ .claim | default (printf "%s-%s" (include "stateless.fullname" $) .name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
