{{/*
The volumes of the application.

A volume with a size is a disk: the claim is created here, and the pod
mounts it. A volume without a size is a temporary directory: it is empty
when the application restarts.

The claim is named after the release and the volume: two applications of the
same namespace do not share their disks.
*/}}
{{- range .Values.volumes }}
{{- if .size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stateless.fullname" $ }}-{{ .name }}
  labels:
    {{- include "stateless.labels" $ | nindent 4 }}
    kuberpack.dev/volume: {{ .name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .size | quote }}
{{- end }}
{{- end }}
