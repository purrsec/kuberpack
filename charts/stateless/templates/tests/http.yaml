apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stateless.fullname" . }}-test
  labels:
    app.kubernetes.io/name: {{ include "stateless.fullname" . }}-test
    app.kubernetes.io/component: helm-test
    app.kubernetes.io/part-of: kuberpack
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          url={{ printf "http://%s:%v%s" (include "stateless.fullname" .) .Values.port .Values.healthcheck | quote }}
          # The test starts next to the app. While the app is still converging,
          # the ingress NetworkPolicy may not be in place yet, so the SYN is
          # dropped and an unbounded `wget` would hang until the Helm timeout
          # instead of retrying. `-T` bounds each attempt so the loop actually
          # retries and succeeds as soon as the app answers.
          i=0
          while [ "$i" -lt 90 ]; do
            wget -q -T 2 -O /dev/null "$url" && echo "ok $url" && exit 0
            i=$((i + 1))
            sleep 1
          done
          echo "timed out after $i attempts: $url never returned 2xx" >&2
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL
