apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stateless.fullname" . }}-test
  labels:
    app.kubernetes.io/name: {{ include "stateless.fullname" . }}-test
    app.kubernetes.io/component: helm-test
    app.kubernetes.io/part-of: kuberpack
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          url={{ printf "http://%s:%v%s" (include "stateless.fullname" .) .Values.port .Values.healthcheck | quote }}
          # The readiness/startup probes tolerate 30*2s = 60s. The test must be
          # at least as patient so a slow-but-healthy app is not failed early
          # (this raced and made the release flaky).
          i=0
          while [ "$i" -lt 60 ]; do
            wget -q -O /dev/null "$url" && echo "ok $url" && exit 0
            i=$((i + 1))
            sleep 2
          done
          echo "timed out after $i attempts: $url never returned 2xx" >&2
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL
