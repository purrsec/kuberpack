apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stateless.fullname" . }}-test
  labels:
    {{- include "stateless.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          url={{ printf "http://%s:%v%s" (include "stateless.fullname" .) .Values.port .Values.healthcheck | quote }}
          i=0
          while [ "$i" -lt 30 ]; do
            wget -q -O /dev/null "$url" && exit 0
            i=$((i + 1))
            sleep 2
          done
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop:
            - ALL
