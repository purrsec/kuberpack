image: ""
port: 8080
healthcheck: /
hostname: ""
replicas: 1
ingressClassName: ""
imagePullSecrets: []
enableServiceLinks: false
command: []
ingress:
  tls: false
  annotations: {}
networkPolicy:
  enabled: true
  # Public HTTPS (Stripe, GitHub). Set false to keep only DNS + peers.
  internet: true
  # Other Kuberpack apps (`billing`) or addons (`postgres:web`).
  peers: []
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
# Production: Kuberpack sets secretRef name app-<app>. The Secret is not in this chart.
envFrom: []
# Railpack images often have USER root. A numeric UID is required for runAsNonRoot.
podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
