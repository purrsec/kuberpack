image: ""
port: 8080
healthcheck: /
hostname: ""
replicas: 1
ingressClassName: ""
imagePullSecrets: []
enableServiceLinks: false
command: []
ingress:
  tls: false
  annotations: {}
networkPolicy:
  enabled: true
  # Public HTTPS (Stripe, GitHub). Set false to keep only DNS + peers.
  internet: true
  # Other Kuberpack apps (`billing`) or addons (`postgres:web`).
  peers: []
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
# Production: Kuberpack sets secretRef name app-<app>. The Secret is not in this chart.
envFrom: []
# Extra literal env entries (name/value or valueFrom). Used by previews to
# expose the preview database details without putting credentials in Git.
env: []
# The volumes of the application. A volume without a size is a temporary
# one; a volume with a size is a disk that outlives the pod. It is how a
# database that is a file is deployed.
volumes: []
# A published image sometimes writes in its own filesystem, and expects to
# be root: the manifest says so when it is the case.
writableRoot: false
runAsRoot: false
# The capabilities a published image needs. The chart drops them all; an
# image with an init system needs to change the owner of its files and to
# drop its privileges itself.
capabilities: []
# Railpack images often have USER root. A numeric UID is required for runAsNonRoot.
podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
